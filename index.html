<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CORE-RING ENGINE · 향상된 버전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── 변수: THE BLACK IDENTITY (CoreRing 색상 시스템) ─────────────────────────────────── */
    :root {
      --bg: #0A0A0A;
      --surface: #1A1A1A;
      --glass: rgba(255, 255, 255, 0.05);
      --accent: #F2C4A0;
      --text: #FDF8F3;
      --muted: #888888;
      --border: rgba(255, 255, 255, 0.1);
      --success: #8FBFAB;
      --warning: #F2C4A0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif KR', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 애니메이션 ──────────────────────────────────────────────── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(100%);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    @keyframes barcodeScan {
      0%, 100% {
        opacity: 0.3;
      }
      50% {
        opacity: 1;
      }
    }

    /* ── 헤더 (상단) ──────────────────────────────────────────────── */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .header-logo {
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    /* ── 메인 콘텐츠 ──────────────────────────────────────────────── */
    .main {
      padding-top: 56px;
      padding-bottom: 120px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── 바코드 배경 애니메이션 ──────────────────────────────────────────────── */
    .barcode-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
    }

    .barcode-line {
      position: absolute;
      background: var(--accent);
      animation: barcodeScan 3s ease-in-out infinite;
    }

    .barcode-line:nth-child(1) {
      width: 2px;
      height: 100px;
      left: 10%;
      top: 20%;
    }

    .barcode-line:nth-child(2) {
      width: 3px;
      height: 80px;
      left: 20%;
      top: 40%;
      animation-delay: 0.3s;
    }

    .barcode-line:nth-child(3) {
      width: 2px;
      height: 90px;
      left: 30%;
      top: 30%;
      animation-delay: 0.6s;
    }

    /* ── 카드 레이아웃 ──────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      animation: fadeUp 0.6s ease both;
      position: relative;
      z-index: 1;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    /* ── 입력 영역 ──────────────────────────────────────────────── */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-field {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent);
      background: rgba(242, 196, 160, 0.05);
    }

    .input-field::placeholder {
      color: var(--muted);
    }

    .send-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(242, 196, 160, 0.3);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* ── 태그 그룹 ──────────────────────────────────────────────── */
    .tag-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tag {
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .tag.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    /* ── 하단 네비게이션 (Bottom Navigation) ──────────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding: 8px 0 16px 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
      padding: 8px;
      border-radius: 12px;
    }

    .nav-item:hover {
      background: var(--glass);
    }

    .nav-icon {
      font-size: 24px;
    }

    .nav-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .nav-item.active .nav-label {
      color: var(--accent);
    }

    /* ── 플로팅 액션 버튼 (FAB) ──────────────────────────────────────────────── */
    .fab {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 56px;
      height: 56px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(242, 196, 160, 0.3);
      transition: all 0.3s;
      z-index: 99;
    }

    .fab:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(242, 196, 160, 0.5);
    }

    .fab:active {
      transform: scale(0.95);
    }

    /* ── 모달 ──────────────────────────────────────────────── */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: none;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      animation: slideUp 0.3s ease both;
    }

    .modal-handle {
      height: 4px;
      width: 40px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
    }

    /* ── 반응형 디자인 ──────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .card {
        max-width: 100%;
        margin: 0 12px;
      }

      .header {
        height: 48px;
        padding: 0 12px;
      }

      .main {
        padding-bottom: 100px;
      }
    }

    /* ── 제스처 피드백 ──────────────────────────────────────────────── */
    @supports (padding: max(0px)) {
      .bottom-nav {
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <header class="header">
    <div class="header-logo">CORERING</div>
    <div class="header-actions">
      <button class="header-btn" title="설정">⚙️</button>
      <button class="header-btn" title="공유">📤</button>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="main">
    <!-- 바코드 배경 애니메이션 -->
    <div class="barcode-bg">
      <div class="barcode-line"></div>
      <div class="barcode-line"></div>
      <div class="barcode-line"></div>
    </div>

    <!-- 카드 -->
    <div class="card">
      <div class="card-title">quản lý</div>
      <div class="card-subtitle">에너지</div>

      <!-- 태그 그룹 -->
      <div class="tag-group">
        <span class="tag active">🏙️ 북부</span>
        <span class="tag">🌴 남부</span>
        <span class="tag">📚 학습</span>
      </div>

      <!-- 입력 영역 -->
      <div class="input-group">
        <input type="text" class="input-field" placeholder="심장을 분석합니다..." />
        <button class="send-btn">🔍</button>
      </div>

      <div style="font-size: 12px; color: var(--muted); text-align: center;">
        💡 팁: 길게 눌러 북마크하거나 스와이프로 이전 기록을 확인하세요
      </div>
    </div>
  </main>

  <!-- 플로팅 액션 버튼 -->
  <div class="fab" onclick="openModal('recordModal')">🎤</div>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchNav(this, 'translate')">
      <div class="nav-icon">🌐</div>
      <div class="nav-label">번역</div>
    </div>
    <div class="nav-item" onclick="switchNav(this, 'history')">
      <div class="nav-icon">📜</div>
      <div class="nav-label">기록</div>
    </div>
    <div class="nav-item" onclick="switchNav(this, 'bookmark')">
      <div class="nav-icon">🔖</div>
      <div class="nav-label">북마크</div>
    </div>
    <div class="nav-item" onclick="switchNav(this, 'community')">
      <div class="nav-icon">👥</div>
      <div class="nav-label">커뮤니티</div>
    </div>
  </nav>

  <!-- 음성 입력 모달 -->
  <div class="modal" id="recordModal" onclick="closeModal(this)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-title">🎤 음성 입력</div>
      <p style="font-size: 13px; color: var(--muted); margin-bottom: 16px;">
        베트남어 성조를 정확하게 인식합니다
      </p>
      <button style="width: 100%; background: var(--accent); color: var(--bg); border: none; border-radius: 12px; padding: 12px; font-size: 14px; cursor: pointer; font-weight: 600;">
        🎙️ 녹음 시작
      </button>
    </div>
  </div>

  <script>
    function switchNav(el, section) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      el.classList.add('active');
      console.log(`Switched to: ${section}`);
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
    }

    function closeModal(el) {
      el.classList.remove('open');
    }

    // 제스처 제어 (스와이프)
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    });

    document.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) {
          console.log('Swiped left - next');
        } else {
          console.log('Swiped right - previous');
        }
      }
    });

    // 길게 눌러 북마크
    let longPressTimer;
    document.addEventListener('touchstart', (e) => {
      longPressTimer = setTimeout(() => {
        console.log('Long pressed - bookmark');
      }, 500);
    });

    document.addEventListener('touchend', () => {
      clearTimeout(longPressTimer);
    });
  </script>
</body>
</html>
